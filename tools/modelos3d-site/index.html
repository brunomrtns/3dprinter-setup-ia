<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modelos 3D — Testes locais</title>
<style>
:root{--bg:#0d0f12;--card:#171a20;--fg:#e8eaed;--mut:#8a919c;--acc:#6cf;--line:#262a33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
header{padding:10px 14px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
h1{font-size:16px;margin:0;font-weight:650}
.sub{color:var(--mut);font-size:11px;margin-top:3px}
#cases{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
#cases::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--mut);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#06222b;font-weight:650}
#modes{display:flex;gap:6px;padding:0 14px 8px;flex-wrap:wrap}
.mode{flex:1;min-width:70px;padding:8px 6px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--mut);font-size:11.5px;cursor:pointer;text-align:center}
.mode.on{border-color:var(--acc);color:var(--acc)}
.mode small{display:block;font-size:9.5px;opacity:.7;margin-top:2px}
#stage{position:relative;height:calc(100% - 118px);min-height:0}
#stage.vs{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.vp{position:relative;background:radial-gradient(ellipse at 50% 35%,#1a1e26 0%,#0b0d10 75%);overflow:hidden}
.vp canvas{display:block;width:100%;height:100%;touch-action:none}
.vp .tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#cfd4db;
  font-size:10.5px;padding:3px 8px;border-radius:6px;pointer-events:none;z-index:2}
.vp .info{position:absolute;bottom:8px;left:8px;right:8px;background:rgba(0,0,0,.55);
  color:#9aa3ad;font-size:10px;padding:5px 8px;border-radius:6px;pointer-events:none;z-index:2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp .spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--mut);font-size:12px;pointer-events:none}
#controls{display:flex;gap:8px;justify-content:center;padding:8px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
button.ctl{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  color:var(--fg);font-size:12.5px;cursor:pointer}
button.ctl.on{border-color:var(--acc);color:var(--acc)}
@media (max-width:640px){#stage{height:calc(100% - 122px)}.vp .info{font-size:9px}}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}
</script>
</head>
<body>
<header>
  <h1>Modelos 3D — comparativo local (Fase C)</h1>
  <div class="sub">mesma imagem de entrada · seed 42 · RTX 3060 · arraste p/ girar, pinça/scroll p/ zoom</div>
</header>
<div id="cases"></div>
<div id="modes"></div>
<div id="stage"></div>
<div id="controls">
  <button class="ctl" id="btnAuto">Girar: auto</button>
  <button class="ctl" id="btnVs">Comparar: off</button>
  <button class="ctl" id="btnReset">Resetar câmera</button>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
